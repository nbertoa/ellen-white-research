name: Validar manuscrito

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validar-y-ensamblar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validación estructural y ensamblado
        run: python scripts/manuscrito.py

      - name: Comprobar que las ediciones para escuchar están al día
        run: |
          python scripts/edicion_audio.py
          git diff --exit-code ediciones/

      - name: Publicar manuscrito e informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscrito-validado
          path: |
            build/manuscrito-completo.md
            build/validacion-manuscrito.txt
